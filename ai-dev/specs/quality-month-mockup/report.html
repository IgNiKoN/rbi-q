<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ежемесячный отчёт качества — октябрь 2026 (образец)</title>
<style>
/* Светлая тема RBI (rbi-light-v2) — для печати */
:root{
  --bg:#e8e4dc;--card:#ffffff;--card2:#faf8f4;--text:#172330;--muted:#5d6873;--line:rgba(28,43,57,.14);--line2:rgba(28,43,57,.24);
  --gold:#c49a5f;--gold2:#d8bd91;--accent-text:#8a6a35;--ok:#5f7f6d;--warn:#b8844a;--bad:#9f4c45;--blue:#4c7288;--violet:#7a6aa0;
  --sel:rgba(196,154,95,.13);--chip:rgba(196,154,95,.16);--graphite:#1c2b39;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:11px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;background:#1c2b39;color:#e9e4da;font-size:12px}
.toolbar b{font-weight:800}
.toolbar .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#1c2b39;background:#c49a5f;border-radius:4px;padding:2px 6px}
.toolbar .sp{flex:1}
.toolbar button,.toolbar a{background:#c49a5f;color:#172330;border:0;border-radius:7px;padding:6px 11px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}
.toolbar a.ghost{background:transparent;color:#d8bd91;padding:6px 4px}
.pages{padding:20px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
.page{position:relative;width:210mm;max-width:100%;min-height:297mm;background:var(--card);box-shadow:0 10px 30px rgba(23,35,48,.15);padding:13mm 13mm 17mm;overflow:hidden}
.pfoot{position:absolute;left:13mm;right:13mm;bottom:7mm;display:flex;justify-content:space-between;font-size:9px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);border-bottom:2px solid var(--gold);padding-bottom:5px;margin-bottom:10px}
.phead b{color:var(--text);letter-spacing:.04em}
h1{font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 8px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h2 .n{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--chip);color:var(--accent-text);font-size:10px;font-weight:900;flex:none}
h3{font-size:11.5px;margin:0 0 4px}
.sub{color:var(--muted);font-size:10px;margin:0 0 6px}
.blk{break-inside:avoid;margin-bottom:8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.box{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card2);break-inside:avoid;min-width:0}
.muted{color:var(--muted)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* Титул */
.cover-top{display:flex;align-items:center;gap:10px;margin-bottom:22mm}
.cover-top i{width:34px;height:34px;border-radius:8px;background:var(--gold);color:#172330;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px}
.cover-top div{font-size:12px;font-weight:800;letter-spacing:.03em}
.cover-top small{display:block;font-weight:500;color:var(--muted);letter-spacing:0}
.cover .kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:6px}
.cover .month{font-size:40px;font-weight:850;letter-spacing:-.03em;margin:4px 0 6px;color:var(--graphite)}
.cover .scope{font-size:11.5px;color:var(--muted);max-width:150mm}
.cover .sample{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:2px 7px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12mm 0 8mm}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 8px 7px;min-width:0}
.kpi .k{font-size:8.5px;font-weight:750;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);line-height:1.2;min-height:21px}
.kpi .v{font-size:20px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:3px}
.kpi .v small{font-size:10px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .p{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d{font-size:9px;font-weight:800;margin-top:2px}
.badge{display:inline-block;font-size:8.5px;font-weight:800;border-radius:999px;padding:1px 6px;background:rgba(28,43,57,.07);color:var(--muted);white-space:nowrap}
.badge.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.main-list{margin:0;padding:0;list-style:none;counter-reset:m;display:grid;gap:7px}
.main-list li{counter-increment:m;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:12px;line-height:1.45}
.main-list li::before{content:counter(m);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--graphite);color:#fff;font-size:10px;font-weight:800}

/* таблицы */
.tbl-wrap{overflow-x:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:10px}
table.t th{font-size:8.5px;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:1.5px solid var(--line2)}
table.t td{padding:3px 5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
table.t .r{text-align:right}
table.t tr.faint td{color:var(--muted)}
table.t td small{color:var(--muted)}
.chip{display:inline-block;font-size:8.5px;font-weight:800;border-radius:999px;padding:1px 6px;white-space:nowrap}
.chip.green{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.yellow{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#8a5f2c}
.chip.red{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bcl{display:inline-block;font-size:8px;font-weight:850;border-radius:3px;padding:0 3px;margin-right:4px}
.bcl.b1{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.bcl.b2{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#8a5f2c}
.bcl.b3{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.heat{border-collapse:separate;border-spacing:2px;font-size:9.5px;width:100%}
.heat th{font-size:8px;color:var(--muted);font-weight:700;padding:1px}
.heat th.rh{text-align:left;color:var(--text);font-size:9.5px;white-space:nowrap}
.heat td{text-align:center;border-radius:4px;padding:4px 1px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.heat td small{display:block;font-size:7.5px;font-weight:600;opacity:.8}
.heat td.pale{opacity:.5;background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(127,127,127,.18) 3px 5px)}
.heat td.empty{color:var(--line2);font-weight:500}
.par .row{display:grid;grid-template-columns:118px minmax(0,1fr) 56px;gap:6px;align-items:center;font-size:9.5px;margin-bottom:3px}
.par .bar{position:relative;height:9px;background:rgba(28,43,57,.06);border-radius:2px}
.par .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:2px;opacity:.4}
.par .row.in80 .bar b{opacity:.95}
.par .row.in80 .lbl{font-weight:750}
.par .bar i{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--bad)}
.par .row span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.concl ul{margin:0 0 8px;padding-left:16px;display:grid;gap:4px;font-size:11px}
.concl h3{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 5px}
.recs li{font-size:11px}
.appx h3{font-size:11.5px;margin:10px 0 3px;color:var(--graphite)}
.appx p{margin:0 0 4px;font-size:10.5px}
.appx .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:4px 7px;margin:3px 0 5px;display:block;white-space:normal}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:4px 0}
.steps div{border-radius:4px;background:rgba(28,43,57,.06);padding:4px 3px;text-align:center;font-size:9px;font-weight:700;line-height:1.2}
.steps div small{display:block;font-weight:500;color:var(--muted)}
.note{font-size:10px;color:var(--muted);border-left:3px solid var(--gold);padding:3px 0 3px 8px;margin:6px 0}
/* --- графики (общие для макета и отчёта) --- */
.chart-svg{display:block;max-width:100%;height:auto;overflow:visible;font-family:inherit}
.chart-svg .ax{font-size:10px;fill:var(--muted)}
.chart-svg .ax-sel{fill:var(--text);font-weight:700}
.chart-svg .ax-bad{fill:var(--bad);font-weight:700}
.chart-svg .val{font-size:11px;font-weight:800;fill:var(--text)}
.chart-svg .in-bar{font-size:9.5px;font-weight:700;fill:#fff;opacity:.92}
.chart-svg .grid{stroke:var(--line);stroke-width:1}
.chart-svg .thr{stroke-width:1.2;stroke-dasharray:4 4}
.chart-svg .thr-ok{stroke:var(--ok)} .chart-svg .thr-bad{stroke:var(--bad)}
.chart-svg .thr-lbl-ok{fill:var(--ok);font-weight:700} .chart-svg .thr-lbl-bad{fill:var(--bad);font-weight:700}
.chart-svg .sel-band{fill:var(--sel)}
.chart-svg .ci-band{fill:var(--gold);opacity:.18}
.chart-svg .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .ln-base{stroke:var(--gold)}
.chart-svg .ln-final{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:5 4}
.chart-svg .dot-base{fill:var(--gold);stroke:var(--card);stroke-width:1.5}
.chart-svg .dot-final{fill:var(--blue)}
.chart-svg .dot-hollow{fill:var(--card);stroke:var(--gold);stroke-width:2}
.chart-svg .bar-n{fill:var(--line2)} .chart-svg .bar-sel{fill:var(--gold);opacity:.75}
.chart-svg .bar-few{fill:none;stroke:var(--bad);stroke-width:1.2;stroke-dasharray:3 2}
.chart-svg .z-ok{fill:var(--ok)} .chart-svg .z-warn{fill:var(--warn)} .chart-svg .z-bad{fill:var(--bad)}
.chart-svg .few{opacity:.38}
.chart-svg .b-1{fill:var(--blue)} .chart-svg .b-2{fill:var(--warn)} .chart-svg .b-3{fill:var(--bad)}
.chart-svg .s-1{stroke:var(--gold)} .chart-svg .s-2{stroke:var(--blue)} .chart-svg .s-3{stroke:var(--violet)}
.chart-svg circle.dot.s-1{fill:var(--gold);stroke:var(--card)} .chart-svg circle.dot.s-2{fill:var(--blue);stroke:var(--card)} .chart-svg circle.dot.s-3{fill:var(--violet);stroke:var(--card)}
.chart-svg .zone-bg-ok{fill:var(--ok);opacity:.08} .chart-svg .zone-bg-warn{fill:var(--warn);opacity:.08} .chart-svg .zone-bg-bad{fill:var(--bad);opacity:.09}
.chart-svg .sk-iss{fill:var(--blue)} .chart-svg .sk-cls{fill:var(--ok)}
.chart-svg .ln-open{stroke:var(--bad);stroke-width:2}
.chart-svg .dot-open{fill:var(--bad);stroke:var(--card);stroke-width:1.2}
.spark{display:block}
.spark .ln-spark{fill:none;stroke:var(--gold);stroke-width:1.6;opacity:.85}
.spark .dot-base{fill:var(--gold)} .spark .dot-hollow{fill:var(--card);stroke:var(--gold);stroke-width:1.4}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);margin:2px 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg i.line{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.lg i.dash{height:0;border-top:2px dashed;width:16px;vertical-align:3px;border-radius:0}
.lg i.hollow{border-radius:50%;border:2px solid var(--gold);background:transparent;width:9px;height:9px}

.chart-svg{width:100%;height:auto}
.lg{font-size:9px;margin:0 0 4px}
.chart-svg .ax{font-size:9px}

@media (max-width:820px){
  .toolbar{position:static}
  .pages{padding:12px 8px 30px;gap:12px}
  .page{min-height:0;padding:16px 14px 44px}
  .pfoot{left:14px;right:14px;bottom:12px}
  .two{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child{grid-column:1/-1}
  .cover-top{margin-bottom:24px}
  .cover .month{font-size:32px}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .par .row{grid-template-columns:96px minmax(0,1fr) 52px}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .pages{padding:0;gap:0;display:block}
  .page{box-shadow:none;width:210mm;height:297mm;min-height:0;max-width:none;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto;page-break-after:auto}
  .tbl-wrap{overflow:visible}
}
</style>
</head>

<div class="pages" id="pages"></div>
<script>
/* ===== Общие данные и расчёты (одинаковые в index.html и report.html) =====
   Исходные данные выдуманы генератором с фиксированным зерном.
   Формулы перенесены из js/shared/math.utils.js (УрК базовый/итоговый, Kc/Kcrit,
   УрК подрядчика Ks/KB3, ±E по Стьюденту, ступени 7/16/24/32/51, зоны 85/70, ИКО)
   и sk.actions.js (ИСД), sk.desktop.content.js (ИДЗ). */
var MQ = (function () {
  'use strict';

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(20261027);
  function pickW(arr, wkey) {
    var tot = 0, i; for (i = 0; i < arr.length; i++) tot += arr[i][wkey];
    var x = R() * tot;
    for (i = 0; i < arr.length; i++) { x -= arr[i][wkey]; if (x <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }

  /* ---------- Справочники ---------- */
  var M_FULL = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var M_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
  var M_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MONTHS = [];
  for (var mi = 0; mi < 12; mi++) {
    var y = 2025 + Math.floor((10 + mi) / 12), m = (10 + mi) % 12;
    var startDay = Math.round((Date.UTC(y, m, 1) - Date.UTC(2025, 10, 1)) / 864e5);
    var endDay = Math.round((Date.UTC(y, m + 1, 1) - Date.UTC(2025, 10, 1)) / 864e5) - 1;
    MONTHS.push({
      i: mi, y: y, m: m, start: startDay, end: endDay,
      full: M_FULL[m].charAt(0).toUpperCase() + M_FULL[m].slice(1) + ' ' + y,
      prep: M_PREP[m] + ' ' + y,
      short: M_SHORT[m] + (m === 0 || mi === 0 ? ' ' + String(y).slice(2) : '')
    });
  }

  var OBJECTS = [
    { id: 'o1', name: 'ЖК «Северный парк»', short: 'Северный парк' },
    { id: 'o2', name: 'ЖК «Речной квартал»', short: 'Речной квартал' },
    { id: 'o3', name: 'ЖК «Лесная гавань»', short: 'Лесная гавань' }
  ];
  var CONTRACTORS = [
    { id: 'A', name: 'Подрядчик А', base: 0.042, trend: function (i) { return 1.05 - i * 0.012; }, sk: 9, onTime: 0.80 },
    { id: 'B', name: 'Подрядчик Б', base: 0.125, trend: function (i) { return 1.55 - i * 0.07; }, sk: 6, onTime: 0.62 },
    { id: 'V', name: 'Подрядчик В', base: 0.085, trend: function (i) { return i >= 10 ? 1.55 : 0.9; }, sk: 5, onTime: 0.70 },
    { id: 'G', name: 'Подрядчик Г', base: 0.150, trend: function () { return 1.0; }, sk: 6, onTime: 0.48 },
    { id: 'D', name: 'Подрядчик Д', base: 0.060, trend: function () { return 1.0; }, sk: 4, onTime: 0.86 },
    { id: 'E', name: 'Подрядчик Е', base: 0.055, trend: function () { return 1.0; }, sk: 2, onTime: 0.75 }
  ];
  var INSPECTORS = [
    { id: 'i1', name: 'Орлов Д. (выдуманный)' , short: 'Орлов Д.' },
    { id: 'i2', name: 'Белова К. (выдуманная)', short: 'Белова К.' },
    { id: 'i3', name: 'Захаров М. (выдуманный)', short: 'Захаров М.' },
    { id: 'i4', name: 'Лебедева Т. (выдуманная)', short: 'Лебедева Т.' }
  ];
  var TYPES = [
    { id: 'mono', name: 'Монолитные работы', short: 'Монолит', risk: 1.5, items: [
      ['Шаг и диаметр арматуры', 3], ['Защитный слой бетона', 3], ['Нахлёст и анкеровка арматуры', 2], ['Геометрия стен и колонн', 2],
      ['Раковины, сколы, оголение арматуры', 2], ['Закладные детали и проёмообразователи', 2], ['Крепление и зазоры опалубки', 1], ['Уход за бетоном', 1], ['Чистота основания перед бетонированием', 1], ['Отметки верха плиты', 2], ['Рабочие швы бетонирования', 2], ['Вибрирование, пустоты', 2], ['Отбор образцов бетона', 1]] },
    { id: 'brick', name: 'Кладка стен', short: 'Кладка', risk: 1.2, items: [
      ['Армирование кладки', 3], ['Опирание перемычек', 3], ['Перевязка швов', 2], ['Вертикальность и ровность кладки', 2],
      ['Примыкание к перекрытию', 2], ['Толщина швов', 1], ['Заполнение швов раствором', 1], ['Чистота лицевой поверхности', 1], ['Деформационные швы', 2], ['Утеплитель и пена в швах', 1], ['Размеры проёмов', 2], ['Гидроизоляция под первым рядом', 2]] },
    { id: 'roof', name: 'Кровля', short: 'Кровля', risk: 1.4, items: [
      ['Примыкания к парапетам и шахтам', 3], ['Пробная проливка', 3], ['Уклон к воронкам', 2], ['Нахлёст рулонов', 2],
      ['Пароизоляция', 2], ['Воронки и обогрев', 2], ['Стыки утеплителя', 1], ['Огрунтовка основания', 1], ['Крепёж утеплителя', 2], ['Аэраторы', 1], ['Защитный слой кровли', 1], ['Фартуки и отливы парапетов', 2]] },
    { id: 'facade', name: 'Фасад (навесной)', short: 'Фасад', risk: 1.3, items: [

    [0, 50, 100].forEach(function (g) { s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/>' + txt(pl - 6, y(g) + 3.5, g + '%', 'ax', 'end'); });
    r.months.forEach(function (m, i) {
      if (!m.N) return;
      var bwid = Math.min(bw * 0.72, 34), bx = x(i) - bwid / 2, acc = 0, few = m.N < 7;
      [['green', m.green.mean, 'z-ok'], ['yellow', m.yellow.mean, 'z-warn'], ['red', m.red.mean, 'z-bad']].forEach(function (z) {
        var v = z[1]; if (v <= 0) return;
        var y1 = y(acc + v), y2 = y(acc);
        s += '<rect x="' + bx.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + Math.max(0, y2 - y1 - 1).toFixed(1) + '" class="' + z[2] + (few ? ' few' : '') + '"><title>' + esc(MQ.MONTHS[i].full + ': ' + (z[0] === 'green' ? 'зелёная' : z[0] === 'yellow' ? 'жёлтая' : 'красная') + ' ' + fmt(v) + ' % из ' + m.N + ' проверок') + '</title></rect>';
        if (!narrow && bwid >= 22 && y2 - y1 > 14) s += txt(x(i), (y1 + y2) / 2 + 3.5, fmt(v), 'in-bar');
        acc += v;
      });
      if (few) s += txt(x(i), pt + 10, 'мало', 'ax ax-bad');
    });
    s += xAxis(r, x, bw, h - 4, w);
    return s + '</svg>';
  }

  /* 6. B1/B2/B3 на 100 проверенных пунктов — столбики с накоплением */
  function bclass(w, r) {
    var narrow = w < 520, pl = 30, pr = 8, pt = 18, h1 = narrow ? 160 : 180, h = pt + h1 + 22;
    var ms = r.months, mx = 0;
    ms.forEach(function (m) { mx = Math.max(mx, m.b1p + m.b2p + m.b3p); });
    mx = Math.ceil(mx / 5) * 5 || 5;
    var B = band(12, w, pl, pr), x = B.x, bw = B.bw, y = lin(0, mx, pt + h1, pt);
    var s = svgOpen(w, h, 'Дефекты B1, B2, B3 на 100 проверенных пунктов');
    for (var g = 0; g <= mx; g += 5) s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" class="grid"/>' + txt(pl - 6, y(g) + 3.5, g, 'ax', 'end');
    ms.forEach(function (m, i) {
      if (!m.N) return;
      var bwid = Math.min(bw * 0.62, 28), bx = x(i) - bwid / 2, acc = 0;
      [['B1', m.b1p, 'b-1', m.b1], ['B2', m.b2p, 'b-2', m.b2], ['B3', m.b3p, 'b-3', m.b3]].forEach(function (z) {
        if (z[1] <= 0) return;
        var y1 = y(acc + z[1]), y2 = y(acc);
        s += '<rect x="' + bx.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + Math.max(0, y2 - y1 - 1).toFixed(1) + '" class="' + z[2] + (m.N < 7 ? ' few' : '') + '"><title>' + esc(MQ.MONTHS[i].full + ': ' + z[0] + ' — ' + fmt(z[1], 1) + ' на 100 пунктов (' + z[3] + ' из ' + m.items + ')') + '</title></rect>';
        acc += z[1];
      });
      if (i === r.mi || (!narrow && i === r.mi - 1)) s += txt(x(i), y(acc) - 5, fmt(acc, 1), i === r.mi ? 'val' : 'ax');
    });
    s += xAxis(r, x, bw, h - 4, w);
    return s + '</svg>';
  }

  /* 7. ИКО объектов по месяцам */
  var OBJ_CLS = ['s-1', 's-2', 's-3'];
  function iko(w, r) {
    var narrow = w < 520, pl = 34, pr = 8, pt = 12, h1 = narrow ? 160 : 180, h = pt + h1 + 22;
    var B = band(12, w, pl, pr), x = B.x, bw = B.bw, y = lin(0, 1, pt + h1, pt);
    var s = svgOpen(w, h, 'Индекс критичности объектов по месяцам');
    s += '<rect x="' + pl + '" y="' + y(1) + '" width="' + (w - pl - pr) + '" height="' + (y(0.6) - y(1)) + '" class="zone-bg-bad"/>';
    s += '<rect x="' + pl + '" y="' + y(0.6) + '" width="' + (w - pl - pr) + '" height="' + (y(0.3) - y(0.6)) + '" class="zone-bg-warn"/>';
    s += '<rect x="' + pl + '" y="' + y(0.3) + '" width="' + (w - pl - pr) + '" height="' + (y(0) - y(0.3)) + '" class="zone-bg-ok"/>';
    [0, 0.3, 0.6, 1].forEach(function (g) { s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/>' + txt(pl - 6, y(g) + 3.5, fmt(g, 1), 'ax', 'end'); });
    s += '<rect x="' + (x(r.mi) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + h1 + '" class="sel-band"/>';
    r.objs.forEach(function (o) {
      var k = MQ.OBJECTS.indexOf(o.o), d = '', st = false;
      o.series.forEach(function (v, i) { if (!v) { st = false; return; } d += (st ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v.iko).toFixed(1); st = true; });
      s += '<path d="' + d + '" class="ln ' + OBJ_CLS[k] + '"/>';
      o.series.forEach(function (v, i) {
        if (!v) return;
        s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v.iko).toFixed(1) + '" r="' + (i === r.mi ? 4.5 : 3) + '" class="dot ' + OBJ_CLS[k] + '"><title>' + esc(o.o.name + ', ' + MQ.MONTHS[i].full + ': ИКО ' + fmt(v.iko, 2) + ' — ' + v.status + ' (' + v.pairs + ' участков от 7 проверок)') + '</title></circle>';
      });
    });
    s += xAxis(r, x, bw, h - 4, w);
    return s + '</svg>';
  }

  /* 8. Стройконтроль: выдано / закрыто (столбики) и открыто на конец (линия) */
  function sk(w, r) {
    var narrow = w < 520, pl = 30, pr = 8, pt = 14, h1 = narrow ? 160 : 180, h = pt + h1 + 22;
    var ss = r.sk, mx = 0;
    ss.forEach(function (m) { mx = Math.max(mx, m.issued, m.closed, m.open); });
    mx = Math.ceil(mx / 20) * 20 || 20;
    var B = band(12, w, pl, pr), x = B.x, bw = B.bw, y = lin(0, mx, pt + h1, pt);
    var s = svgOpen(w, h, 'Стройконтроль: выдано, закрыто, открыто');
    for (var g = 0; g <= mx; g += mx / 4) s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" class="grid"/>' + txt(pl - 6, y(g) + 3.5, fmt(g), 'ax', 'end');
    s += '<rect x="' + (x(r.mi) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + h1 + '" class="sel-band"/>';
    ss.forEach(function (m, i) {
      var bwid = Math.min(bw * 0.34, 12);
      s += '<rect x="' + (x(i) - bwid - 1).toFixed(1) + '" y="' + y(m.issued).toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + (y(0) - y(m.issued)).toFixed(1) + '" class="sk-iss"><title>' + esc(MQ.MONTHS[i].full + ': выдано ' + m.issued) + '</title></rect>';
      s += '<rect x="' + (x(i) + 1).toFixed(1) + '" y="' + y(m.closed).toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + (y(0) - y(m.closed)).toFixed(1) + '" class="sk-cls"><title>' + esc(MQ.MONTHS[i].full + ': закрыто ' + m.closed) + '</title></rect>';
    });
    var d = '';
    ss.forEach(function (m, i) { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(m.open).toFixed(1); });
    s += '<path d="' + d + '" class="ln ln-open"/>';
    ss.forEach(function (m, i) { s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(m.open).toFixed(1) + '" r="3" class="dot-open"><title>' + esc(MQ.MONTHS[i].full + ': открыто на конец месяца ' + m.open) + '</title></circle>'; });
    s += xAxis(r, x, bw, h - 4, w);
    return s + '</svg>';
  }

  /* Мини-линия для плитки */
  function spark(w, h, vals, sel, few) {
    var v = vals.filter(function (a) { return a != null; });
    if (v.length < 2) return '';
    var mn = Math.min.apply(null, v), mx = Math.max.apply(null, v); if (mx - mn < 1) { mx += 0.5; mn -= 0.5; }
    var x = lin(0, vals.length - 1, 3, w - 3), y = lin(mn, mx, h - 3, 3), d = '', st = false, dots = '';
    vals.forEach(function (a, i) {
      if (a == null) { st = false; return; }
      d += (st ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(a).toFixed(1); st = true;
      if (i === sel) dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(a).toFixed(1) + '" r="2.6" class="dot-base"/>';
      else if (few[i]) dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(a).toFixed(1) + '" r="2" class="dot-hollow"/>';
    });
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path d="' + d + '" class="ln ln-spark"/>' + dots + '</svg>';
  }

  return { trend: trend, zones: zones, bclass: bclass, iko: iko, sk: sk, spark: spark, esc: esc };
})();

</script>
<script>
/* ===== Образец ежемесячного отчёта (октябрь 2026, все объекты) ===== */
(function () {
  'use strict';
  var fmt = MQ.fmt, fmtS = MQ.fmtS, pl = MQ.plural, esc = CH.esc;
  var r = MQ.compute({ month: 11 });
  var M = r.M, P = r.P, c = r.cur, p = r.prev;
  var GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var total = 6;

  function head(t) { return '<div class="phead"><b>RBI · КАЧЕСТВО</b><span>Ежемесячный отчёт качества · ' + M.full + '</span></div>'; }
  function foot(n) { return '<div class="pfoot"><span>Образец. Данные выдуманы. Показатели — по формулам приложения RBI Quality.</span><span>стр. ' + n + ' из ' + total + '</span></div>'; }
  function page(n, html, cls) { return '<section class="page ' + (cls || '') + '">' + (n > 1 ? head() : '') + html + foot(n) + '</section>'; }
  function zone(v) { return v >= 85 ? 'ok' : v >= 70 ? 'warn' : 'bad'; }
  function chip(z, t) { return '<span class="chip ' + z + '">' + t + '</span>'; }
  function cmpBadge(t) {
    if (t.cmp.kind === 'few') return '<span class="badge">мало данных</span>';
    if (t.cmp.kind === 'within') return '<span class="badge">в пределах разброса</span>';
    return '<span class="badge ' + (t.cmp.good ? 'good' : 'bad') + '">' + (t.cmp.good ? 'заметно лучше' : 'заметно хуже') + '</span>';
  }
  function dTxt(t) { if (t.cmp.d == null) return '—'; var a = Math.abs(t.cmp.d) < Math.pow(10, -t.d) / 2 ? '= ' : t.cmp.d > 0 ? '▲ ' : '▼ '; return a + fmtS(t.cmp.d, t.d) + (t.unit === '%' ? ' п.п.' : ''); }

  /* --- стр. 1: титул + главное --- */
  var objs = MQ.OBJECTS.map(function (o) { return o.name; }).join(', ');
  var kp = r.tiles.map(function (t) {
    return '<div class="kpi"><div class="k">' + t.title + '</div><div class="v ' + ((t.key === 'base' || t.key === 'final') ? zone(t.cur.mean) : '') + '">' + fmt(t.cur.mean, t.d) + '<small>' + (t.unit || '') + (t.cur.E != null ? ' ± ' + fmt(t.cur.E, t.d) : '') + '</small></div>' +
      '<div class="p">' + P.full.split(' ')[0] + ': ' + fmt(t.prev.mean, t.d) + (t.unit || '') + '</div><div class="d">' + dTxt(t) + ' ' + cmpBadge(t) + '</div></div>';
  }).join('');
  var main5 = r.findings.main.slice(0, 5);
  var p1 = '<div class="cover"><div class="cover-top"><i>RBI</i><div>RBI · Качество<small>Аналитика → Месяц</small></div></div>' +
    '<div class="kicker">Ежемесячный отчёт качества</div><h1 class="month">' + M.full + '</h1>' +
    '<div class="scope">Объекты: ' + objs + '. Подрядчиков: ' + c.nCon + ', видов работ: ' + c.nTypes + ', инспекторов: ' + c.nIns + '. Период: 1–31 октября 2026 (календарный месяц), сравнение — с сентябрём 2026.<br>Сформирован автоматически 1 ноября 2026.</div>' +
    '<span class="sample">ОБРАЗЕЦ — все данные выдуманы</span>' +
    '<div class="kpis">' + kp + '</div>' +
    '<h2>Главное за месяц</h2><ol class="main-list">' + main5.map(function (t) { return '<li><span>' + esc(t) + '</span></li>'; }).join('') + '</ol>' +
    '<div class="note" style="margin-top:8mm">Все показатели — про <b>осмотренное</b> (выборочный аудит): это доля брака среди проверенного, а не по всей стройке. «± …» — разброс: с вероятностью около 95 % настоящее значение лежит в этих пределах. Как считается — в приложении на стр. 6.</div></div>';

  /* --- стр. 2: показатели, тренд, зоны, состав --- */
  var trows = r.tiles.map(function (t) {
    return '<tr><td><b>' + t.title + '</b></td><td class="r"><b class="' + ((t.key === 'base' || t.key === 'final') ? zone(t.cur.mean) : '') + '">' + fmt(t.cur.mean, t.d) + (t.unit || '') + '</b> ± ' + fmt(t.cur.E, t.d) + '<br><small>от ' + fmt(Math.max(0, t.cur.mean - t.cur.E), t.d) + ' до ' + fmt(t.unit === '%' ? Math.min(100, t.cur.mean + t.cur.E) : t.cur.mean + t.cur.E, t.d) + '</small></td>' +
      '<td class="r">' + fmt(t.prev.mean, t.d) + (t.unit || '') + ' ± ' + fmt(t.prev.E, t.d) + '</td><td class="r">' + dTxt(t) + '</td><td>' + cmpBadge(t) + '</td></tr>';
  }).join('');
  var comp = Object.keys(c.byType).sort(function (a, b) { return c.byType[b] - c.byType[a]; }).map(function (t) { return MQ.TYPE[t].short + ' ' + c.byType[t]; }).join(' · ');
  var p2 = '<h2><span class="n">1</span>Объём выборки и показатели месяца</h2>' +
    '<p style="margin:0 0 6px;font-size:11px"><b>' + fmt(c.N) + '</b> ' + pl(c.N, 'проверка', 'проверки', 'проверок') + ' (сентябрь: ' + fmt(p.N) + '), <b>' + fmt(c.items) + '</b> проверенных пунктов чек-листов. Надёжность месяца — <b>«' + c.conf.name + '»</b>.</p>' +
    '<div class="blk"><div class="tbl-wrap"><table class="t"><thead><tr><th>Показатель</th><th class="r">Октябрь</th><th class="r">Сентябрь</th><th class="r">Изменение</th><th>Оценка</th></tr></thead><tbody>' + trows + '</tbody></table></div>' +
    '<p class="sub" style="margin-top:4px">«Заметно» — изменение больше разброса обоих месяцев. «В пределах разброса» — разница может быть случайной, считаем «не изменилось».</p></div>' +
    '<h2><span class="n">2</span>Динамика за 12 месяцев</h2>' +
    '<div class="blk"><h3>Уровень качества (УрК) по месяцам</h3><div class="lg"><span><i class="line" style="background:var(--gold)"></i>Базовый УрК</span><span><i style="background:var(--gold);opacity:.3"></i>разброс ±</span><span><i class="dash" style="border-color:var(--blue)"></i>Итоговый УрК</span><span><i class="hollow"></i>меньше 7 проверок (январь — мало данных)</span><span><i style="background:var(--line2)"></i>число проверок</span></div><div class="chart" data-ch="trend"></div></div>' +
    '<div class="two blk"><div class="box"><h3>Объём и состав выборки</h3><p style="margin:0 0 4px">Проверок: <b>' + fmt(c.N) + '</b>, пунктов: <b>' + fmt(c.items) + '</b>, объектов: ' + c.nObj + ', подрядчиков: ' + c.nCon + ', инспекторов: ' + c.nIns + '.</p><p style="margin:0 0 4px">По видам работ: ' + comp + '.</p><p style="margin:0 0 4px">УрК с постоянным составом видов работ: <b>' + fmt(c.baseMix, 1) + ' %</b> (обычный базовый — ' + fmt(c.base.mean, 1) + ' %). ' + (Math.abs(c.baseMix - c.base.mean) < 1 ? 'Разница меньше 1 п.п. — состав выборки на результат почти не повлиял.' : 'Разница ' + fmt(Math.abs(c.baseMix - c.base.mean), 1) + ' п.п. — часть изменения объясняется составом выборки.') + '</p><p class="sub" style="margin:0">Самый слабый месяц по числу проверок — январь 2026 (' + r.months[2].N + ' проверок, «мало данных»).</p></div>' +
    '<div><h3>Зоны качества — доли проверок</h3><div class="lg"><span><i style="background:var(--ok)"></i>от 85</span><span><i style="background:var(--warn)"></i>70–84</span><span><i style="background:var(--bad)"></i>B3 или ниже 70</span></div><div class="chart" data-ch="zones"></div></div></div>';

  /* --- стр. 3: дефекты --- */
  var top = r.top.map(function (t, i) {
    var ar = t.d == null ? '<span class="muted">—</span>' : t.d >= 5 ? '<span class="bad">▲ ' + fmtS(t.d) + '</span>' : t.d <= -5 ? '<span class="ok">▼ ' + fmtS(t.d) + '</span>' : '<span class="muted">≈</span>';
    return '<tr><td class="r">' + (i + 1) + '</td><td><span class="bcl b' + t.item.w + '">B' + t.item.w + '</span>' + esc(t.item.name) + '<br><small>' + MQ.TYPE[t.item.type].short + ' · чаще у ' + t.mainCon.name.replace('Подрядчик ', '') + '</small></td><td class="r"><b>' + t.fail + ' из ' + t.chk + '</b>' + (t.chk < 7 ? '<br><small>мало проверок</small>' : '') + '</td><td class="r">' + fmt(t.rate) + ' %</td><td class="r">' + (t.prate != null ? fmt(t.prate) + ' %' : '—') + '</td><td class="r">' + ar + '</td><td class="r">' + (t.photos || '—') + '</td></tr>';
  }).join('');
  var par = r.pareto.map(function (x) {
    return '<div class="row ' + (x.in80 ? 'in80' : '') + '"><span class="lbl">' + esc(x.name) + '</span><div class="bar"><b style="width:' + (x.n / r.pareto[0].n * 100).toFixed(1) + '%"></b><i style="left:' + Math.min(99, x.cum).toFixed(1) + '%"></i></div><span>' + x.n + ' · ' + fmt(x.cum) + ' %</span></div>';
  }).join('');
  var p80 = r.pareto.filter(function (x) { return x.in80; }).length;
  var reps = r.repeats.slice(0, 6).map(function (x) {
    return '<tr><td><span class="bcl b' + x.item.w + '">B' + x.item.w + '</span>' + esc(x.item.name) + '<br><small>' + x.c.name + ' · ' + MQ.TYPE[x.item.type].short + '</small></td><td class="r"><b class="bad">' + x.streak + ' мес.</b></td><td>' + x.hist.map(function (h) { return MQ.MONTHS[h.mi].short + ' ' + h.fail + '/' + h.chk; }).join(', ') + '</td></tr>';
  }).join('');
  var p3 = '<h2><span class="n">3</span>Дефекты</h2>' +
    '<div class="two blk"><div><h3>Невыполненные пункты на 100 проверенных</h3><div class="lg"><span><i style="background:var(--blue)"></i>B1</span><span><i style="background:var(--warn)"></i>B2</span><span><i style="background:var(--bad)"></i>B3</span></div><div class="chart" data-ch="bclass"></div></div>' +
    '<div class="box"><h3>Октябрь 2026</h3><p style="margin:0 0 4px;font-size:11px">Проверено <b>' + fmt(c.items) + '</b> пунктов, не выполнено <b>' + c.fails + '</b> (' + fmt(c.per100.mean, 1) + ' на 100).</p>' +
    '<p style="margin:0 0 4px;font-size:11px">B1 — ' + fmt(c.b1p, 1) + ', B2 — ' + fmt(c.b2p, 1) + ', B3 — ' + fmt(c.b3p, 1) + ' на 100 пунктов.</p>' +
    '<p style="margin:0;font-size:11px">Доля критичных (B3) среди всех дефектов: <b class="' + (c.critShare > 15 ? 'bad' : '') + '">' + fmt(c.critShare) + ' %</b> (' + c.b3 + ' из ' + c.fails + '; сентябрь — ' + fmt(p.critShare) + ' %).</p>' +
    '<p class="sub" style="margin-top:6px">Проверок с хотя бы одним B3: ' + c.nB3insp + ' из ' + c.N + '.</p></div></div>' +
    '<div class="blk"><h3>Топ-10 типовых дефектов</h3><p class="sub">«5 из 8» — не выполнен в 5 проверках из 8, где пункт проверяли · стрелка — к сентябрю (±5 п.п.)</p>' +
    '<div class="tbl-wrap"><table class="t"><thead><tr><th class="r">#</th><th>Пункт чек-листа</th><th class="r">Не выполнен</th><th class="r">Частота</th><th class="r">Сентябрь</th><th class="r">К сент.</th><th class="r">Фото</th></tr></thead><tbody>' + top + '</tbody></table></div></div>' +
    '<div class="two blk"><div><h3>Причины (Парето)</h3><p class="sub">' + p80 + ' ' + pl(p80, 'причина', 'причины', 'причин') + ' дают 80 % дефектов · без причины: ' + r.noCause + '</p><div class="par">' + par + '</div></div>' +
    '<div><h3>Повторяются 2+ месяца подряд</h3><p class="sub">Тот же пункт у того же подрядчика · не выполнено / проверено</p><div class="tbl-wrap"><table class="t"><tbody>' + reps + '</tbody></table></div>' + (r.repeats.length > 6 ? '<p class="sub">и ещё ' + (r.repeats.length - 6) + '</p>' : '') + '</div></div>';

  /* --- стр. 4: подрядчики, тепловая карта, объекты --- */
  var cons = r.cons.map(function (x, i) {
    var m = x.m;
    return '<tr class="' + (m.conf.few ? 'faint' : '') + '"><td class="r">' + (i + 1) + '</td><td><b>' + x.c.name + '</b><br><small>' + x.types.map(function (t) { return MQ.TYPE[t].short; }).join(', ') + '</small></td>' +
      '<td class="r"><b class="' + zone(m.U) + '">' + m.U + '</b> ± ' + fmt(m.E) + '<br><small>нижн. граница ' + fmt(Math.max(0, m.lo)) + '</small></td><td class="r">' + (x.mp ? x.mp.U : '—') + '</td>' +
      '<td class="r">' + (x.d == null ? '—' : fmtS(x.d)) + '<br><small>' + (x.kind === 'notable' ? 'заметно' : x.kind === 'within' ? 'в пределах' : 'мало данных') + '</small></td>' +
      '<td class="r">' + m.N + '</td><td>' + m.conf.name + '</td><td>' + chip(m.zone, m.zoneText) + '</td><td>' + m.stabText + ' ' + m.stab + '</td></tr>';
  }).join('');
  var H = r.heat3, tps = MQ.TYPES.filter(function (t) { return Object.keys(H).some(function (k) { return k.split('|')[1] === t.id; }); });
  function hc(v) { var q = Math.min(1, v / 30), col = q < 0.33 ? 'var(--ok)' : q < 0.66 ? 'var(--warn)' : 'var(--bad)'; return 'background:color-mix(in srgb,' + col + ' ' + (18 + Math.round(q * 45)) + '%,#fff)'; }
  var heat = '<table class="heat"><thead><tr><th></th>' + tps.map(function (t) { return '<th>' + t.short + '</th>'; }).join('') + '</tr></thead><tbody>' + MQ.CONTRACTORS.map(function (cc) {
    return '<tr><th class="rh">' + cc.name.replace('Подрядчик ', 'Подр. ') + '</th>' + tps.map(function (t) {
      var e = H[cc.id + '|' + t.id]; if (!e) return '<td class="empty">·</td>';
      return '<td class="' + (e.n < 7 ? 'pale' : '') + '" style="' + hc(e.v) + '">' + fmt(e.v, 1) + '<small>' + e.n + ' пр.</small></td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody></table>';
  var ob = r.objs.map(function (o) {
    var x = o.cur, y = o.prev;
    return '<tr><td><b>' + o.o.name + '</b><br><small>' + o.mon.N + ' проверок · базовый УрК ' + fmt(o.mon.base.mean, 1) + ' %</small></td><td class="r"><b class="' + (x.zone === 'green' ? 'ok' : x.zone === 'yellow' ? 'warn' : 'bad') + '">' + fmt(x.iko, 2) + '</b></td><td class="r">' + (y ? fmt(y.iko, 2) : '—') + '</td><td>' + chip(x.zone, x.status) + '</td><td class="r">' + x.green + ' / ' + x.yellow + ' / ' + x.red + ' %</td></tr>';
  }).join('');
  var p4 = '<h2><span class="n">4</span>Подрядчики</h2>' +
    '<div class="blk"><p class="sub">УрК подрядчика за календарный месяц (все проверки) с поправками на системный брак и долю B3. Порядок — по нижней границе разброса; меньше 7 проверок — внизу, серым.</p><div class="tbl-wrap"><table class="t"><thead><tr><th class="r">#</th><th>Подрядчик</th><th class="r">УрК окт.</th><th class="r">Сент.</th><th class="r">Изм.</th><th class="r">Пров.</th><th>Надёжность</th><th>Зона</th><th>Стабильность</th></tr></thead><tbody>' + cons + '</tbody></table></div></div>' +
    '<div class="blk"><h3>Подрядчик × вид работ, август — октябрь</h3><p class="sub">Невыполненных пунктов на 100 проверенных за 3 месяца; под числом — проверок; штриховка — меньше 7 проверок</p><div class="tbl-wrap">' + heat + '</div></div>' +
    '<h2 style="margin-top:6px"><span class="n">5</span>Объекты</h2>' +
    '<div class="two blk"><div><h3>Индекс критичности (ИКО) по месяцам</h3><div class="lg">' + r.objs.map(function (o, k) { return '<span><i class="line" style="background:var(' + ['--gold', '--blue', '--violet'][k] + ')"></i>' + o.o.short + '</span>'; }).join('') + '</div><div class="chart" data-ch="iko"></div></div>' +
    '<div><h3>Октябрь 2026</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Объект</th><th class="r">ИКО</th><th class="r">Сент.</th><th>Риск</th><th class="r">Зоны з/ж/к</th></tr></thead><tbody>' + ob + '</tbody></table></div><p class="sub" style="margin-top:4px">ИКО от 0 до 1: ниже 0,30 — низкий риск, 0,30–0,59 — повышенный, от 0,60 — высокий. Окно 3 месяца.</p></div></div>';

  /* --- стр. 5: стройконтроль, выводы, рекомендации --- */
  var s = r.sk[11], sp = r.sk[10];
  var skr = r.skCons.map(function (x) {
    var q = x.cur;
    return '<tr><td><b>' + x.c.name + '</b></td><td class="r">' + q.issued + '</td><td class="r">' + q.closed + '</td><td class="r">' + q.open + '</td><td class="r">' + (q.onTimePct != null ? fmt(q.onTimePct) + ' %' : '—') + '</td><td class="r">' + fmt(q.overduePct) + ' %</td><td class="r">' + fmt(q.avgLate, 1) + '</td><td class="r"><b class="' + (q.idz == null ? '' : q.idz >= 70 ? 'ok' : q.idz >= 45 ? 'warn' : 'bad') + '">' + (q.idz != null ? fmt(q.idz) : '—') + '</b></td><td class="r">' + x.isd.isd + '</td></tr>';
  }).join('');
  var F = r.findings;
  var p5 = '<h2><span class="n">6</span>Стройконтроль (замечания ПК СК)</h2>' +
    '<div class="blk box" style="background:color-mix(in srgb,var(--warn) 10%,#fff)">Блок — пример. Окончательные цифры — после единого правила «открыто» и «просрочено».</div>' +
    '<div class="blk"><p style="margin:0 0 5px;font-size:11px">Октябрь: выдано <b>' + s.issued + '</b>, закрыто <b>' + s.closed + '</b>, открыто на конец месяца <b>' + s.open + '</b> (сентябрь — ' + sp.open + '). Висят: 0–7 дней — ' + s.age.a + ', 8–30 — ' + s.age.b + ', больше 30 — <b class="bad">' + s.age.c + '</b>.</p>' +
    '<div class="tbl-wrap"><table class="t"><thead><tr><th>Подрядчик</th><th class="r">Выдано</th><th class="r">Закрыто</th><th class="r">Открыто</th><th class="r">В срок</th><th class="r">Просроч.</th><th class="r">Ср. проср., дн.</th><th class="r">ИДЗ</th><th class="r">ИСД</th></tr></thead><tbody>' + skr + '</tbody></table></div></div>' +
    '<h2 style="margin-top:8px"><span class="n">7</span>Выводы и рекомендации</h2><div class="concl">' +
    '<h3>Заметно изменилось (больше разброса)</h3><ul>' + (F.notable.length ? F.notable.map(function (n) { return '<li class="' + (n.good ? 'ok' : 'bad') + '"><b>' + esc(n.text) + '</b></li>'; }).join('') : '<li class="muted">Ничего — все изменения в пределах разброса.</li>') + '</ul>' +
    '<h3>В пределах разброса — не считаем изменением</h3><ul class="muted">' + F.within.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    '<h3>Что сделать в ноябре</h3><ul class="recs">' + F.recs.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';

  /* --- стр. 6: приложение --- */
  var steps = MQ.STEPS.map(function (x) { return '<div>' + x.name + '<small>' + x.note + '</small></div>'; }).join('');
  var p6 = '<h2>Приложение. Как считались показатели</h2><div class="appx">' +
    '<p>Все показатели считаются по тем же правилам, что и в приложении RBI Quality (один общий файл формул). Месяц — календарный: с 1-го по последнее число, берутся <b>все</b> проверки месяца.</p>' +
    '<h3>Базовый УрК (уровень качества) одной проверки</h3><span class="f">Базовый УрК = вес выполненных пунктов ÷ вес проверенных пунктов × 100</span><p>Вес пункта по классу: B1 (малозначительный) = 1, B2 (значительный) = 2, B3 (критичный) = 3. Пункты, которые в этот раз не проверяли, в расчёт не входят — поэтому УрК честен к выборке. УрК месяца — среднее по проверкам.</p>' +
    '<h3>Итоговый УрК</h3><span class="f">Итоговый = базовый × Kc × Kcrit; при любом B2 или B3 — не выше 84</span><p>Kc — за долю невыполненных B2 среди проверенных B2: меньше 20 % → 0,95; 20–49 % → 0,85; 50 % и больше → 0,70. Kcrit = 0,5, если найден хотя бы один B3.</p>' +
    '<h3>Зоны</h3><p>Зелёная — от 85 и без B3 («Принято»). Жёлтая — 70–84 («Исправить»). Красная — есть B3 или ниже 70 («Брак / стоп»).</p>' +
    '<h3>Дефекты на 100 проверенных пунктов</h3><span class="f">= невыполненных пунктов ÷ проверенных пунктов × 100</span><p>Делим на пункты, а не на проверки: чек-листы разной длины. «Топ-10» — частота невыполнения пункта среди проверок, где этот пункт проверяли («5 из 8»).</p>' +
    '<h3>Что значит «± …» (разброс)</h3><span class="f">± = коэффициент Стьюдента × (стандартное отклонение ÷ √ число проверок)</span><p>Проверяем не всё, а выборку, поэтому любое число — оценка. «УрК 88 ± 3» значит: скорее всего (≈ 95 %) настоящий УрК от 85 до 91. Чем больше проверок и чем ровнее результаты, тем меньше разброс. Для долей (B3, красная зона) — та же логика по формуле для долей.</p>' +
    '<h3>Когда изменение «заметное»</h3><p>Только если разница между месяцами больше разброса <b>и этого, и прошлого</b> месяца. Иначе пишем «в пределах разброса»: разница может быть случайной, не делаем выводов.</p>' +
    '<h3>Что значит «мало данных»</h3><div class="steps">' + steps + '</div><p>Меньше 7 проверок — «сбор данных»: число показываем серым, стрелки и сравнения не делаем, на графике — пустой кружок. 7–15 — предварительно. Ступени — те же, что в рейтинге подрядчиков.</p>' +
    '<h3>УрК подрядчика</h3><span class="f">= среднее итоговых УрК за месяц × Ks × KB3; при штрафе — не выше 84</span><p>Ks — системность: насколько часто не выполняется один и тот же пункт B2 (10 % → 0,95; 20 % → 0,85; 40 % → 0,70; 60 % → 0,50). KB3 — доля проверок с B3 (до 5 % → 0,95; 5–9 % → 0,90; 10–19 % → 0,85; 20–29 % → 0,70; от 30 % → 0,50). Стабильность = (1 − стандартное отклонение ÷ 50) × 100. Порядок в таблице — по нижней границе (УрК − разброс).</p>' +
    '<h3>ИКО объекта</h3><p>Для каждого участка «подрядчик × вид работ» с 7+ проверками за 3 месяца: опасность = 1 − УрК × стабильность × (0,5, если были B3). ИКО — среднее опасностей с весом риска вида работ.</p>' +
    '<h3>Стройконтроль</h3><span class="f">ИДЗ = доля в срок × 0,6 + (100 − доля просроченных) × 0,4 − средняя просрочка, дней</span><p>ИСД = выдано замечаний ÷ ожидаемое число × 100; ожидаемое = объём работ × частота брака B2 + B3 по проверкам.</p>' +
    '<h3>Чего выборка не говорит</h3><p>Показатели описывают <b>осмотренное</b>. Пересчитывать их на весь объём работ нельзя; сколько всего было доступно к проверке, сейчас не учитывается.</p></div>';

  document.getElementById('pages').innerHTML = page(1, p1) + page(2, p2) + page(3, p3) + page(4, p4) + page(5, p5) + page(6, p6);

  function draw() {
    document.querySelectorAll('[data-ch]').forEach(function (el) {
      var w = Math.floor(el.clientWidth); if (w < 120) return;
      el.innerHTML = CH[el.getAttribute('data-ch')](w, r);
    });
  }
  draw();
  var t = null;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 80); });
})();

</script>
</body>
</html>
