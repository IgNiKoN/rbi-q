<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компания — сейчас / предлагаю</title>
<style>
:root{--bg:#0b121b;--ui:#e7ecf1;--uim:#8d99a6;--line:rgba(255,255,255,.12);--gold:#c49a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ui);font:14px/1.45 Inter,'IBM Plex Sans',-apple-system,system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:#0b121bf2;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header.top h1{font-size:15px;margin:0 8px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--uim);padding:7px 11px;font:inherit;cursor:pointer;min-height:36px}
.seg button.on{background:var(--gold);color:#111}
.tabsel{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabsel button{background:#141e2a;border:1px solid var(--line);color:var(--ui);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.tabsel button.on{border-color:var(--gold);color:var(--gold)}
.intro{padding:12px 16px;color:var(--uim);max-width:1100px}
.intro b{color:var(--ui)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 16px 16px}
.cols.one{grid-template-columns:minmax(0,1fr)}
.col h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--uim);margin:6px 0 8px}
.col h2 span{color:var(--gold)}
.scr-cap{font-size:12px;color:var(--uim);margin:14px 0 6px}
.scr-cap b{color:var(--ui)}
.stage{max-width:100%;background:#05090e;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.stage img{display:block;width:100%;height:auto}
.scaler{transform-origin:0 0}
.map{padding:0 16px 40px;max-width:1300px}
.map h3{font-size:14px;margin:14px 0 6px}
.map table{width:100%;border-collapse:collapse;font-size:13px}
.map td,.map th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.map th{color:var(--uim);font-weight:600}
.map .n{color:var(--gold);white-space:nowrap}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

/* ===== Предлагаемый экран (тема приложения) ===== */
.app{--bg-main:#101923;--card-bg:#172331;--card-2:#1c2a3a;--card-border:rgba(255,255,255,.12);--text-main:#f4f4f4;--text-muted:#a8b2bd;--accent:#c49a5f;--ok:#4caf7d;--danger:#e06b5f;
  background:var(--bg-main);color:var(--text-main);font:15px/1.45 Inter,'IBM Plex Sans',-apple-system,system-ui,sans-serif;min-height:400px}
.app.light{--bg-main:#f6f3ee;--card-bg:#fff;--card-2:#faf8f4;--card-border:rgba(28,43,57,.14);--text-main:#1c2b39;--text-muted:#66727f}
.app *{box-sizing:border-box}
.a-shell{display:flex;min-height:100%}
.a-rail{width:200px;flex:none;border-right:1px solid var(--card-border);padding:14px 10px;display:none}
.a-rail .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:12px 8px 6px}
.a-rail a{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;color:var(--text-main);text-decoration:none;font-size:14px;min-height:40px}
.a-rail a.on{background:var(--accent);color:#111;font-weight:700}
.a-main{flex:1;min-width:0;padding:14px 16px 90px}
.a-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.a-title{font-size:20px;font-weight:700;margin:0;flex:1;min-width:0}
.a-sub{color:var(--text-muted);font-size:13px}
.a-company{font:16px inherit;min-height:44px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-main);padding:0 12px}
.a-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 14px}
.a-chips a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 6px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-main);text-decoration:none;font-size:13px;font-weight:600}
.a-chips a.on{background:var(--accent);border-color:var(--accent);color:#111}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-main);font:600 15px inherit;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--accent);border-color:var(--accent);color:#111}
.btn.d{color:var(--danger)}
.btn.s{min-height:40px;padding:0 12px;font-size:14px}
.ico{width:44px;padding:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp{font:16px inherit;min-height:44px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-main);padding:0 12px;min-width:0}
.grow{flex:1 1 220px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start}
.row .x{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px}
.mt{color:var(--text-muted);font-size:13px}
.asg{border-top:1px solid var(--card-border);margin-top:10px;padding-top:10px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.asg .x{flex:1 1 220px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid var(--card-border);margin:3px 4px 0 0}
.pill.g{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.w{color:#e0b34f;border-color:#e0b34f80}
.pill.r{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.note{border:1px dashed var(--accent);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.sheet{background:var(--card-2);border:1px solid var(--card-border);border-radius:16px;padding:14px;margin:14px 0}
.sheet h4{margin:0 0 2px;font-size:17px}
.f{display:grid;gap:4px;margin:10px 0}
.f label{font-size:13px;color:var(--text-muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
.tree{border:1px solid var(--card-border);border-radius:10px;padding:4px 8px;background:var(--card-bg)}
.tree div{display:flex;align-items:center;gap:8px;min-height:40px}
.tree input,.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.radio{display:flex;flex-wrap:wrap;gap:6px}
.radio span{border:1px solid var(--card-border);border-radius:10px;padding:10px 12px;min-height:44px;font-size:14px}
.radio span.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.foot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;background:var(--card-2);padding:10px 0 0;border-top:1px solid var(--card-border);margin-top:10px}
.acc{border:1px solid var(--card-border);border-radius:12px;margin:8px 0;overflow:hidden}
.acc>div:first-child{display:flex;justify-content:space-between;align-items:center;padding:12px;font-weight:700;background:var(--card-bg);min-height:48px}
.acc .body{padding:4px 12px 8px}
.list .it{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-bottom:1px solid var(--card-border)}
.list .it:last-child{border-bottom:0}
.list{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--card-border);position:relative;flex:none}
.sw.on{background:var(--ok)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.sw.on::after{left:21px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--text-muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--card-border)}
.tbl td{padding:10px;border-bottom:1px solid var(--card-border)}
.only-wide{display:none}
.split{display:block}
.split>.l{margin-bottom:12px}
.fab{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:8px;pointer-events:none}
.fab .btn{pointer-events:auto;box-shadow:0 6px 20px #0006}
/* ширина экрана: класс на .app */
.app.w768 .a-chips{grid-template-columns:repeat(5,minmax(0,1fr))}
.app.w768 .grid2,.app.w1280 .grid2{grid-template-columns:1fr 1fr}
.app.w1280 .a-rail{display:block}
.app.w1280 .a-chips{display:none}
.app.w1280 .a-main{padding:20px 28px 40px}
.app.w1280 .only-wide{display:table-cell}
.app.w1280 .split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.app.w1280 .split>.l{margin:0}
.app.w1280 .split.wide{grid-template-columns:1fr 440px}
.app.w768 .split.wide .card{margin-bottom:10px}
.app.w1280 .sheet.side{position:relative}
.app.w1280 .fab{display:none}
.app.w768 .fab{display:none}
.app:not(.w375) .ph-only{display:none!important}
.app.w375 .pc-only{display:none}
</style>
</head>
<body>
<header class="top">
  <h1>«Компания» — сейчас / предлагаю · P2-0048 этап 2</h1>
  <div class="seg" id="sz"><button data-w="375" class="on">Телефон 375</button><button data-w="768">Планшет 768</button><button data-w="1280">ПК 1280</button></div>
  <div class="seg" id="th"><button data-t="dark" class="on">Тёмная</button><button data-t="light">Светлая</button></div>
  <div class="seg" id="vr"><button data-r="A" class="on">Вариант А</button><button data-r="B">Вариант Б</button><button data-r="C">Вариант В</button></div>
  <div class="seg" id="vw"><button data-v="both" class="on">Рядом</button><button data-v="now">Сейчас</button><button data-v="new">Предлагаю</button></div>
</header>
<nav class="tabsel" id="tabs"></nav>
<div class="intro" id="intro"></div>
<div class="cols" id="cols">
  <div class="col" id="cnow"><h2>Сейчас <span id="nowlbl"></span></h2><div class="stage"><img id="nowimg" alt="Экран сейчас"></div></div>
  <div class="col" id="cnew"><h2>Предлагаю <span id="newlbl"></span></h2><div id="newstage"></div></div>
</div>
<section class="map" id="map"></section>

<script>
const TABS = [
  ['settings','Все настройки'],['members','Сотрудники'],['roles','Роли'],['objects','Проекты'],['counterparties','Контрагенты'],['directories','Справочники'],
  ['branding','Оформление'],['modules','Модули'],['audit','Журнал'],['patterns','Образцы']];
const st = {tab:'settings', w:375, theme:'dark', view:'both', variant:'A'};

// общая шапка раздела (Ш1–Ш14)
function shell(active, body){
  if(st.variant==='C') return shellC(active, body);
  if(st.variant==='B') return shellB(active, body);
  const groups=[['Люди',['members','roles']],['Данные компании',['objects','counterparties','directories']],['Компания',['branding','modules','audit']],['Платформа',['patterns']]];
  const rail = groups.map(([g,ids])=>`<div class="g">${g}</div>`+ids.map(id=>`<a class="${id===active?'on':''}">${TABS.find(t=>t[0]===id)[1]}</a>`).join('')).join('');
  const chips = TABS.map(([id,l])=>`<a class="${id===active?'on':''}">${l}</a>`).join('');
  return `<div class="a-shell"><aside class="a-rail"><select class="a-company" style="width:100%"><option>RBI-стенд</option></select>${rail}</aside>
  <main class="a-main">
    <div class="a-head"><div style="flex:1;min-width:0"><div class="a-sub">Настройки · Компания</div><h1 class="a-title">${TABS.find(t=>t[0]===active)[1]}</h1></div>
      <select class="a-company ph-only" aria-label="Компания"><option>RBI-стенд</option></select>
      <span class="a-sub pc-only">admin@stand.invalid</span><button class="btn s">Выйти</button></div>
    <nav class="a-chips">${chips}</nav>${body}</main></div>`;
}
const P = (t,c='')=>`<span class="pill ${c}">${t}</span>`;

const NEW = {
members(){
  const ppl=[['Иванов А.И.','ivanov@…',[['Инженер СК','Вся компания',[P('Объекты Качества: Большевиков, 22','g')]]]],
    ['Петров П.П.','petrov@…',[['Прораб','ЖК Альфа · Секции 1–2',[P('отвечает за факт','ok'),P('до 31.12.2026')]],['Прораб','ЖК Бета · весь проект',[]]]],
    ['Капустин М.А.','kapustin@…',[['Руководство','Вся компания',[]]]],
    ['Тарасов С.Ю.','tarasov@…',[['Инженер СК','Вся компания',[P('Объекты Качества: Струны, ЛИТЕРА','g')]]]],
    ['Сидорова Е.В.','sidorova@…',[['Прораб','ЖК Альфа · Секция 3',[P('временный пароль не сменён','w')]]]],
    ['guest@other.invalid','',[]]];
  const cards=ppl.map(([n,e,a])=>`<div class="card"><div class="row"><div class="x"><div class="nm">${n}</div><div class="mt">${e}</div></div><button class="btn ico" title="Изменить ФИО · Сбросить пароль · Отключить доступ">⋯</button></div>
   ${a.length?a.map(([r,w,p])=>`<div class="asg"><div class="x"><b>${r}</b><div class="mt">${w}</div>${p.join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s">Изменить область</button><button class="btn s d">Отозвать</button></div></div>`).join(''):'<div class="asg mt">нет ролей · <a style="color:var(--accent)">назначить</a></div>'}</div>`).join('');
  const sheet=`<div class="sheet side"><h4>Участие</h4><div class="mt">Назначить или изменить область. Можно сразу нескольких людей.</div>
   <div class="f"><label>Сотрудники</label><div class="inp" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:6px 10px">${P('Петров П.П. ×')}${P('Сидорова Е.В. ×')}<span class="mt">+ добавить</span></div></div>
   <div class="grid2"><div class="f"><label>Роль</label><select class="inp"><option>Прораб</option></select></div>
   <div class="f"><label>Где</label><div class="radio"><span>Вся компания</span><span class="on">Проект</span></div></div></div>
   <div class="f"><label>Проект</label><select class="inp"><option>ЖК Альфа</option></select></div>
   <div class="f"><label>Область — отметьте места (ничего — весь проект)</label><div class="tree">
     <div>▾ <input type="checkbox"> Корпус 1</div><div style="padding-left:24px">▸ <input type="checkbox" checked> Секция 1</div>
     <div style="padding-left:24px">▸ <input type="checkbox" checked> Секция 2</div><div style="padding-left:24px">▸ <input type="checkbox"> Секция 3</div></div></div>
   <label class="chk"><input type="checkbox" checked> Ответственный за факт по этим местам</label>
   <div class="grid2"><div class="f"><label>Срок до (необязательно)</label><input class="inp" placeholder="дд.мм.гггг"></div>
   <div class="f"><label>Фирма подрядчика</label><select class="inp" disabled><option>— только для роли «подрядчик»</option></select></div></div>
   <div class="note">Для роли Качества вместо дерева — галочки «Объекты Качества» (ничего — все объекты). Так привязывают и перепривязывают инженера: «Изменить область» у его назначения.</div>
   <div class="foot"><button class="btn">Отмена</button><button class="btn p">Сохранить · 2 чел. × 2 места</button></div></div>`;
  const add=`<div class="sheet"><h4>Новый сотрудник</h4><div class="grid2"><div class="f"><label>Почта (логин)</label><input class="inp" value="new@company.ru"></div><div class="f"><label>ФИО</label><input class="inp" value="Новиков Н.Н."></div>
   <div class="f"><label>Роль</label><select class="inp"><option>Прораб</option></select></div><div class="f"><label>Проект</label><select class="inp"><option>Все проекты компании</option></select></div></div>
   <div class="foot"><button class="btn">Отмена</button><button class="btn p">Добавить</button></div><div class="mt" style="margin-top:8px">После «Добавить» — временный пароль: «Скопировать» / «Готово» (как сейчас).</div></div>`;
  return shell('members',`<div class="bar"><input class="inp grow" placeholder="Найти по ФИО или почте"><button class="btn p pc-only">+ Участие</button><button class="btn pc-only">+ Сотрудник</button></div>
   <div class="split wide"><div class="l">${cards}</div><div>${sheet}${add}</div></div>
   <div class="fab"><button class="btn">+ Сотрудник</button><button class="btn p">+ Участие</button></div>`);
},
roles(){
  const roles=[['Администратор компании','шаблон',3],['Руководитель проекта','шаблон',2],['Прораб','шаблон',6],['ПТО','шаблон',1],['Инженер СК','',4],['Подрядчик (своя фирма)','',2]];
  const list=`<div class="list">${roles.map(([n,t,c],i)=>`<div class="it" style="${i===2?'box-shadow:inset 3px 0 var(--accent)':''}"><div class="x" style="flex:1"><b>${n}</b> ${t?P('шаблон'):''}<div class="mt">назначена: ${c}</div></div><span class="mt">›</span></div>`).join('')}</div>`;
  const grp=[['Работы и план',['Просмотр работ плана ✓','Добавление и правка работ','ВОР: загрузка и подтверждение']],['Факт',['Просмотр фактических объёмов ✓','Ввод фактического объёма ✓','Подтверждение перебора и чужих записей']],['Деньги и КС-2',['Просмотр денежных сумм','Проект КС-2']],['Качество и стройконтроль',['Просмотр','Правка']],['Администрирование',['Назначение ролей','Журнал']]];
  const ed=`<div class="sheet"><div class="ph-only mt" style="margin-bottom:6px">‹ Все роли</div><h4>Прораб ${P('шаблон')}</h4><div class="mt">Шаблон: правка действий меняет роль у всех, кому она назначена (6 чел.).</div>
   <div class="grid2"><div class="f"><label>Название роли</label><div class="bar" style="margin:0"><input class="inp grow" value="Прораб"><button class="btn s">Переименовать</button></div></div>
   <div class="f"><label>Копировать в новую роль</label><div class="bar" style="margin:0"><input class="inp grow" placeholder="Название копии"><button class="btn s">Копировать</button></div></div></div>
   ${grp.map(([g,a],i)=>`<div class="acc"><div>${g}<span class="mt">${a.filter(x=>x.includes('✓')).length} из ${a.length} ${i<2?'▾':'▸'}</span></div>${i<2?`<div class="body">${a.map(x=>`<label class="chk"><input type="checkbox" ${x.includes('✓')?'checked':''}> ${x.replace(' ✓','')}</label>`).join('')}</div>`:''}</div>`).join('')}
   <div class="foot"><button class="btn d" style="margin-right:auto">Удалить роль</button><button class="btn">Отменить изменения</button><button class="btn p">Сохранить действия</button></div></div>`;
  return shell('roles',`<div class="note ph-only">Телефон: сначала список ролей; нажатие открывает роль на весь экран (ниже — как это выглядит), кнопки «Сохранить / Отменить» закреплены внизу.</div><div class="split"><div class="l">${list}</div><div>${ed}</div></div>`);
},
objects(){
  return shell('objects',`<div class="bar"><input class="inp grow" placeholder="Найти проект по названию или коду"><button class="btn">Фильтр · 1</button><button class="btn ico">⋯</button><button class="btn p pc-only">+ Проект</button></div>
   <div class="bar"><select class="inp ph-only" style="flex:1"><option>Сортировка: по названию ↑</option><option>по стадии</option><option>по срокам</option></select>${P('Стадия: Стройка ×')}<span class="mt">Показано: 4 из 6</span></div>

 patterns:[['Об1–Об9','Образцы дизайн-системы','Без изменений']]
};

const INTRO = {
 members:'<b>Сотрудники.</b> Сейчас форма «Назначить роль» всегда раскрыта над списком и на телефоне уходит за край. Предлагаю: список людей сверху, назначение — кнопкой «+ Участие» в отдельном листе (на ПК — панель справа). У каждого назначения — «Изменить область»: так привязывают и перепривязывают инженера Качества.',
 roles:'<b>Роли.</b> На телефоне список ролей занимает до 70 % экрана, галочки — под ним. Предлагаю: на телефоне «список → роль», группы прав сворачиваются, кнопки закреплены внизу.',
 objects:'<b>Проекты</b> уже переделаны (P2-0046/0047). Только мелкие правки удобства.',
 counterparties:'<b>Контрагенты.</b> Те же функции; на телефоне — одна колонка, «В архив» с подтверждением.',
 directories:'<b>Справочники</b> (единицы измерения). Те же функции, подтверждение удаления — диалогом.',
 branding:'<b>Оформление</b> — старый блок в другом стиле. Переносим в общий стиль раздела, функции те же.',
 modules:'<b>Модули компании</b> — только просмотр, без изменений по смыслу.',
 audit:'<b>Журнал.</b> Фильтры — сеткой, записи — карточками; поля крупнее.',
 patterns:'<b>Образцы</b> — для администратора платформы, без изменений.'
};

function screens(){
  if(st.variant==='C') return (NEW_C[st.tab]||NEW_B[st.tab]||(()=>[['', NEW[st.tab]()]]))();
  if(st.tab==='settings') return [['', `<div class="a-main"><div class="note">Варианты А и Б меняют только раздел «Компания». «Моё» (профиль, интерфейс, устройство, уведомления, Качество, помощь) остаётся как сейчас. Единые настройки для всего — в варианте В.</div></div>`]];
  if(st.variant==='A') return [['', NEW[st.tab]()]];
  const r=(NEW_B[st.tab]||(()=>[['', NEW[st.tab]()]]))();
  return r;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===st.tab));
  const sz = st.w===375?'phone':st.w===768?'tablet':'pc';
  document.getElementById('nowimg').src = `now/${st.tab}-${sz}.png`;
  document.getElementById('nowlbl').textContent = `· ${st.w} px`;
  document.getElementById('newlbl').textContent = `· ${st.w} px · вариант ${({A:'А',B:'Б',C:'В'})[st.variant]}`;
  const cls=`app w${st.w} ${st.theme==='light'?'light':''}`;
  const ns=document.getElementById('newstage');
  ns.style.cssText = st.w<1280 ? `display:grid;gap:4px 16px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,${Math.min(st.w,420)}px),1fr))` : '';
  ns.innerHTML = screens().map(([cap,html])=>
    `<div class="scr">${cap?`<div class="scr-cap">${cap}</div>`:''}<div class="stage"><div class="scaler"><div class="${cls}" style="width:${st.w}px">${html}</div></div></div></div>`).join('');
  document.getElementById('intro').innerHTML = st.variant==='C'?(INTRO_C[st.tab]||INTRO_C.other):(st.variant==='B'?INTRO_B[st.tab]||INTRO[st.tab]:INTRO[st.tab]);
  const m=(st.variant==='C'&&MAP_C[st.tab])||(st.variant!=='A'&&MAP_B[st.tab])||MAP[st.tab]||MAP_C.settings;
  document.getElementById('map').innerHTML = `<h3>Ничего не пропадает: что было → где теперь (вариант ${({A:'А',B:'Б',C:'В'})[st.variant]})</h3><table><tr><th>Пункты описи</th><th>Сейчас</th><th>Где будет</th></tr>${m.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
    <p style="color:var(--uim)">Полная опись (235 пунктов, файл:строка) — <code>ai-dev/reports/P2-0048/settings-inventory.md</code>.</p>`;
  document.getElementById('cnow').style.display = st.view==='new'?'none':'';
  document.getElementById('cnew').style.display = st.view==='now'?'none':'';
  document.getElementById('cols').classList.toggle('one', st.view!=='both');
  requestAnimationFrame(fit);
}
function fit(){
  document.querySelectorAll('#newstage .stage').forEach(stage=>{
    const sc=stage.firstElementChild, app=sc.firstElementChild;
    const k=Math.min(1, stage.clientWidth/st.w); sc.style.transform=`scale(${k})`; stage.style.height=(app.offsetHeight*k)+'px';
  });
  const ns=document.querySelector('#cnow .stage');
  document.getElementById('nowimg').style.width=(st.w*Math.min(1, ns.clientWidth/st.w || 1))+'px';
}
document.getElementById('tabs').innerHTML = TABS.map(([id,l])=>`<button data-id="${id}">${l}</button>`).join('');
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(b){st.tab=b.dataset.id; render();}};
for(const [id,k] of [['sz','w'],['th','t'],['vw','v'],['vr','r']]){
  document.getElementById(id).onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));
    if(k==='w') st.w=+b.dataset.w; if(k==='t') st.theme=b.dataset.t; if(k==='v') st.view=b.dataset.v; if(k==='r') st.variant=b.dataset.r; render();};
}
addEventListener('resize',fit);
document.getElementById('nowimg').onload=fit;
render();
</script>
</body>
</html>
